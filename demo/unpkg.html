<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-maxlength-progress via unpkg</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			form-maxlength-progress:not(:defined) {
				display: none;
			}

			[data-form-maxlength-progress-generated-counter] {
				font-variant-numeric: tabular-nums;
			}

			form-maxlength-progress[proximity='overrun'],
			textarea[aria-invalid='true'] {
				color: crimson;
			}

			.maxlength-field {
				max-inline-size: 30rem;
			}

			.maxlength-field textarea {
				box-sizing: border-box;
				inline-size: 100%;
			}

			.maxlength-field form-maxlength-progress {
				display: block;
				text-align: end;
			}
		</style>
	</head>
	<body>
		<h1>unpkg CDN sanity check</h1>
		<p>
			This page loads the guarded definition helper from
			<code>unpkg</code>. The field allows overrun and receives
			<code>aria-invalid="true"</code> above its limit.
		</p>

		<div class="maxlength-field">
			<label for="unpkg-message">Message</label>
			<textarea id="unpkg-message" maxlength="30"></textarea>
			<form-maxlength-progress
				for="unpkg-message"
				overrun="true"
			></form-maxlength-progress>
		</div>

		<script type="module">
			import { defineFormMaxlengthProgress } from 'https://unpkg.com/@aarongustafson/form-maxlength-progress@latest/define.js?module';

			defineFormMaxlengthProgress();
		</script>
	</body>
</html>
