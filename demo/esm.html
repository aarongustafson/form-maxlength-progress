<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-maxlength-progress via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			form-maxlength-progress:not(:defined) {
				display: none;
			}

			[data-form-maxlength-progress-generated-counter] {
				font-variant-numeric: tabular-nums;
			}

			form-maxlength-progress[proximity='close'] {
				color: darkorange;
			}

			form-maxlength-progress[proximity='target'] {
				color: crimson;
			}

			.maxlength-field {
				display: inline-grid;
				max-inline-size: 100%;
			}

			.maxlength-field textarea {
				box-sizing: border-box;
				inline-size: 30rem;
				max-inline-size: 100%;
			}

			.maxlength-field form-maxlength-progress {
				display: block;
				text-align: end;
			}
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<div class="maxlength-field">
			<label for="esm-message">Message</label>
			<textarea id="esm-message" maxlength="100"></textarea>
			<form-maxlength-progress
				for="esm-message"
			></form-maxlength-progress>
		</div>

		<script type="module">
			import { FormMaxlengthProgressElement } from 'https://esm.sh/@aarongustafson/form-maxlength-progress@1.1.1/form-maxlength-progress.js?bundle&target=es2022';

			if (!customElements.get('form-maxlength-progress')) {
				customElements.define(
					'form-maxlength-progress',
					FormMaxlengthProgressElement,
				);
			}
		</script>
	</body>
</html>
